<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 费用报销中枢</title>
<link rel="stylesheet" href="/admin/static/app.css"></head>
<body><div class="login-wrap"><form class="login" method="post" action="/admin/login">
  <h1>费用报销中枢</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label>用户名</label><input name="user" autofocus autocomplete="username">
  <label>密码</label><input name="password" type="password" autocomplete="current-password">
  <button class="primary" type="submit">登录</button>
  <p class="hint" style="margin-top:14px">凭据见安装时的输出，或运行 ./expense-hub info</p>
</form></div></body></html>
