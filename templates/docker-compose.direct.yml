# 直连模式：以 IP 或本地访问，不签证书（纯 HTTP）。
# 由安装脚本生成，勿手改；需调整请改配置后重新运行安装命令。
services:
  api:
    image: ${IMAGE}
    container_name: expense-hub-api
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      TZ: ${TZ}
      API_TOKEN: ${API_TOKEN}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}
    volumes:
      - ${DATA_DIR}:/data
    ports:
      - "${HOST_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
