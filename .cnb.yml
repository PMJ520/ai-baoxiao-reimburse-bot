# CNB 云构建：在国内构建镜像并推到同平台的制品库。
#
# 为什么用它而不是只靠 GitHub Actions：构建过程要拉基础镜像、装 pip 依赖，
# 在国内跑不用出境；推到同平台 registry 也没有跨境传输。GitHub Actions 那边
# 继续推 ghcr.io，两个源各自就近服务。
#
# 流水线内置了触发者的访问凭据，推 CNB 制品库不需要 docker login。

main:
  push:
    - services:
        - docker
      stages:
        - name: 计算镜像地址
          # 用平台变量而不是写死：仓库改名或迁移时不用改这里
          script: echo -n "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
          exports:
            info: IMAGE_BASE

        # 构建机是 x86_64，默认只出 amd64。Apple Silicon 和 ARM 服务器拉
        # 下来会报 "no matching manifest"，而那个错完全看不出是架构问题。
        # 所以用 buildx 跨架构构建；arm64 走模拟，会慢一些但一次到位。
        - name: 准备跨架构构建
          script: |
            docker run --privileged --rm tonistiigi/binfmt --install arm64 || true
            docker buildx create --use --name multi || docker buildx use multi

        - name: 构建并推送（amd64 + arm64）
          # buildx 的多架构镜像只能直接推，不能先 load 到本地再推
          script: |
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t "$IMAGE_BASE:latest" -t "$IMAGE_BASE:$CNB_COMMIT_SHORT" \
              --push .

        - name: 输出镜像地址
          # 装到服务器上要用这个地址，打出来省得去翻制品库
          script: echo "镜像已推送：$IMAGE_BASE:latest"
