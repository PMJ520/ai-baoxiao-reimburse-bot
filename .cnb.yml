# CNB 云构建：在国内构建镜像并推到同平台的制品库。
#
# 为什么用它而不是只靠 GitHub Actions：构建过程要拉基础镜像、装 pip 依赖，
# 在国内跑不用出境；推到同平台 registry 也没有跨境传输。GitHub Actions 那边
# 继续推 ghcr.io，两个源各自就近服务。
#
# 流水线内置了触发者的访问凭据，推 CNB 制品库不需要 docker login。

main:
  push:
    - services:
        - docker
      stages:
        - name: 计算镜像地址
          # 用平台变量而不是写死：仓库改名或迁移时不用改这里
          script: echo -n "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
          exports:
            info: IMAGE_BASE

        # 这里只出 amd64，是平台限制不是疏忽：
        # 试过 buildx 跨架构，构建 buildkit 容器时报
        #   mounting "sysfs" to rootfs at "/sys": operation not permitted
        # docker-container 驱动需要特权，CNB 的 runner 不给。默认的 docker
        # 驱动又不支持多架构输出，所以这条路在这个平台上走不通。
        #
        # arm64 由 GitHub Actions 那边提供（ghcr.io 上是双架构），
        # install.sh 的选源逻辑会把 ARM 机器直接引到 ghcr。
        - name: 构建镜像
          # 同时打 latest 和短提交号：出问题时能精确回滚到某次提交
          script: docker build -t "$IMAGE_BASE:latest" -t "$IMAGE_BASE:$CNB_COMMIT_SHORT" .

        - name: 推送镜像
          script: |
            docker push "$IMAGE_BASE:latest"
            docker push "$IMAGE_BASE:$CNB_COMMIT_SHORT"

        - name: 输出镜像地址
          # 装到服务器上要用这个地址，打出来省得去翻制品库
          script: echo "镜像已推送：$IMAGE_BASE:latest"
