name: 构建并发布镜像

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt
          # rapidocr 会带入完整版 opencv，与 headless 冲突，只保留 headless
          pip uninstall -y opencv-python opencv-python-headless
          pip install --only-binary=:all: --no-deps opencv-python-headless
      - name: 依赖完整性自检
        run: python scripts/check_deps.py

      - name: 冒烟测试
        run: |
          python -c "
          from app.pipeline.ocr import engine as e
          from app.pipeline import matcher, rules, parsers
          from app.main import app
          assert e.available() == 'rapidocr', f'容器环境应使用 RapidOCR，实得 {e.available()}'
          paths = sorted(app.openapi()['paths'])
          assert '/documents' in paths and '/batches' in paths
          print('OCR 引擎', e.available(), '| 接口', len(paths), '个')
          "

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录镜像仓库
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 提取标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
